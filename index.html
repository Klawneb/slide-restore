<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slide Restore</title>
  <meta name="description" content="Fix faded, blurry and colour-cast photo slides.">
  <meta name="theme-color" content="#17324d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HOME -->
  <section id="home" class="screen active">
    <header class="home-head">
      <img src="icons/icon.svg" alt="" class="home-logo">
      <h1>Slide Restore</h1>
      <p>Bring old slides back to life.</p>
    </header>
    <div class="home-buttons">
      <button id="btn-one" class="big-choice">
        <span class="emoji">📷</span>
        <span class="label">Fix a Photo</span>
        <span class="hint">Choose one photo to fix</span>
      </button>
      <button id="btn-many" class="big-choice">
        <span class="emoji">🗂️</span>
        <span class="label">Fix Many Photos</span>
        <span class="hint">Fix a whole batch at once</span>
      </button>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="editor" class="screen">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <canvas id="cv-after"></canvas>
        <canvas id="cv-before"></canvas>
        <div class="split-line" id="split-line"></div>
        <div class="tag tag-before" id="tag-before">Before</div>
        <div class="tag tag-after" id="tag-after">After</div>
        <div class="crop-box" id="crop-box">
          <span class="h h-t" data-h="t"></span><span class="h h-b" data-h="b"></span>
          <span class="h h-l" data-h="l"></span><span class="h h-r" data-h="r"></span>
          <span class="h h-tl" data-h="tl"></span><span class="h h-tr" data-h="tr"></span>
          <span class="h h-bl" data-h="bl"></span><span class="h h-br" data-h="br"></span>
        </div>
      </div>
      <div class="stage-buttons">
        <button id="btn-back" class="pill">← Back</button>
        <span class="spacer"></span>
        <button id="btn-hold" class="pill">👁 Hold to see original</button>
        <button id="btn-compare" class="pill" aria-pressed="false">↔ Compare</button>
        <button id="btn-crop" class="pill">✂️ Crop</button>
        <button id="btn-rotate" class="pill">⟳ Rotate</button>
      </div>
      <div class="stage-buttons crop-buttons">
        <span class="crop-help">Drag the corners to choose what to keep</span>
        <span class="spacer"></span>
        <button id="crop-auto" class="pill">✨ Auto crop</button>
        <button id="crop-none" class="pill">⬜ Whole photo</button>
        <button id="crop-done" class="pill crop-done">✓ Done</button>
      </div>
    </div>

    <aside class="panel">
      <button id="btn-auto" class="auto-btn">✨ Auto Fix</button>

      <div class="sliders" id="sliders">
        <label class="slider"><span class="s-name">☀️ Brightness</span>
          <input type="range" min="-100" max="100" value="0" data-adj="brightness">
          <span class="s-ends"><span>Darker</span><span>Lighter</span></span></label>
        <label class="slider"><span class="s-name">◐ Contrast</span>
          <input type="range" min="-100" max="100" value="0" data-adj="contrast">
          <span class="s-ends"><span>Softer</span><span>Punchier</span></span></label>
        <label class="slider"><span class="s-name">🌡️ Warmth</span>
          <input type="range" min="-100" max="100" value="0" data-adj="warmth" class="track-warm">
          <span class="s-ends"><span>More blue</span><span>More yellow</span></span></label>
        <label class="slider"><span class="s-name">🎨 Tint</span>
          <input type="range" min="-100" max="100" value="0" data-adj="tint" class="track-tint">
          <span class="s-ends"><span>More green</span><span>More pink</span></span></label>
        <label class="slider"><span class="s-name">🌈 Colour strength</span>
          <input type="range" min="-100" max="100" value="0" data-adj="saturation">
          <span class="s-ends"><span>Less colour</span><span>More colour</span></span></label>
        <label class="slider"><span class="s-name">🔍 Sharpness</span>
          <input type="range" min="-100" max="100" value="0" data-adj="sharpness">
          <span class="s-ends"><span>Softer</span><span>Sharper</span></span></label>
      </div>

      <div class="panel-actions">
        <button id="btn-reset" class="secondary">↺ Start again</button>
        <button id="btn-share" class="secondary" hidden>📤 Share</button>
        <button id="btn-save" class="primary">💾 Save</button>
      </div>
      <button id="btn-done" class="primary" hidden>✓ Done – back to all photos</button>
    </aside>
  </section>

  <!-- BATCH -->
  <section id="batch" class="screen">
    <header class="batch-head">
      <button id="batch-back" class="pill">← Home</button>
      <h2 id="batch-title">Your photos</h2>
      <button id="batch-add" class="pill">＋ Add more</button>
    </header>
    <p class="batch-help">Tap <b>Auto Fix All</b>, then <b>Save All</b>. Tap any photo to fine-tune it.</p>
    <div class="progress" id="progress" hidden><div class="bar" id="progress-bar"></div><span id="progress-text"></span></div>
    <div class="grid" id="grid"></div>
    <footer class="batch-actions">
      <button id="batch-auto" class="auto-btn">✨ Auto Fix All</button>
      <button id="batch-share" class="secondary" hidden>📤 Share All</button>
      <button id="batch-save" class="primary">💾 Save All</button>
    </footer>
  </section>

  <div id="busy" class="busy" hidden><div class="spinner"></div><div class="busy-text">Working…</div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
